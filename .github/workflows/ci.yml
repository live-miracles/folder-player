name: CI

on:
    push:
    pull_request:

jobs:
    checks:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            # npm 12 on the runner rejects this lockfile; npm 11 installs it as before
            - name: Use npm 11
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Check format
              run: npm run format:check

            - name: Run tests
              run: npm test
