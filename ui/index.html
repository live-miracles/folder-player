<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="./dist/output.css" rel="stylesheet" />
  </head>

  <body class="h-screen overflow-hidden">
    <!-- NOTIFICATIONS -->
    <div role="alert" id="error-alert" class="notice fixed top-4 left-1/2 z-999 hidden max-w-160 -translate-x-1/2 border-danger/40">
      <i data-lucide="circle-x" class="text-danger"></i>
      <span id="error-msg"></span>
    </div>

    <div role="alert" id="success-alert" class="notice fixed top-4 left-1/2 z-999 hidden max-w-160 -translate-x-1/2 border-success/40">
      <i data-lucide="circle-check" class="text-success"></i>
      <span id="success-msg"></span>
    </div>

    <div id="update-toast" class="panel fixed bottom-4 left-4 z-9999 hidden w-80 flex-col gap-3 p-4 shadow-2xl shadow-black/60">
      <div class="flex items-center gap-2 font-semibold">
        <i data-lucide="arrow-down-circle" class="h-4 w-4 text-accent-ink"></i>
        Update available
      </div>
      <div id="update-text" class="text-sm text-ink-subtle">Checking...</div>
      <progress id="update-progress" class="progress hidden" value="0" max="100"></progress>
      <div class="flex w-full justify-end gap-2">
        <button id="update-dismiss-btn" class="btn btn-sm btn-ghost hidden">Later</button>
        <button id="update-download-btn" class="btn btn-sm btn-primary hidden">Download</button>
        <button id="update-btn" class="btn btn-sm btn-primary hidden">Restart</button>
      </div>
    </div>

    <div id="zoom-ui" class="fixed top-4 right-4 z-999 hidden scale-90 opacity-0 transition-all duration-200">
      <div class="panel flex items-center gap-1 p-1 shadow-2xl shadow-black/60">
        <button id="zoom-out" class="btn btn-sm btn-ghost btn-icon" aria-label="Zoom out"><i data-lucide="minus"></i></button>
        <span id="zoom-level" class="w-12 text-center text-[13px] tabular-nums">100%</span>
        <button id="zoom-in" class="btn btn-sm btn-ghost btn-icon" aria-label="Zoom in"><i data-lucide="plus"></i></button>
      </div>
    </div>

    <dialog id="create-preset-alerts" class="modal">
      <div class="flex max-h-[calc(100vh-64px)] flex-col">
        <div class="flex items-center justify-between gap-4 border-b border-line px-5 py-4">
          <h2 id="preset-creation-summary" class="text-base font-semibold tracking-tight"></h2>
          <div id="preset-report-summary"></div>
        </div>
        <div id="home-alerts-list" class="min-h-0 flex-1 space-y-3 overflow-y-auto p-5"></div>
        <div class="flex justify-end border-t border-line px-5 py-3">
          <form method="dialog">
            <button class="btn btn-sm">Close</button>
          </form>
        </div>
      </div>
    </dialog>

    <div class="relative h-full w-full">
      <!-- HOME PAGE -->
      <div id="home-page" class="absolute inset-0 overflow-y-auto">
        <header class="app-header sticky top-0 z-20">
          <div class="flex min-w-0 flex-1 items-center gap-2.5">
            <img src="./icon.png" alt="" class="h-6 w-6 rounded-md" />
            <span class="font-semibold tracking-tight">Folder Player</span>
            <span class="chip h-5 px-1.5 text-[11px]">vMix</span>
          </div>
          <div class="flex flex-1 justify-end">
            <a
              href="https://live-miracles.github.io/projects/folder-player/docs/"
              target="_blank"
              rel="noopener"
              class="btn btn-sm btn-ghost"
              title="Open documentation in your browser">
              <i data-lucide="book-open"></i>
              Docs
              <i data-lucide="arrow-up-right" class="text-ink-faint"></i>
            </a>
          </div>
        </header>

        <main class="mx-auto flex w-full max-w-220 flex-col gap-5 px-6 py-8">
          <section class="panel overflow-hidden">
            <!-- Content folder -->
            <div class="p-5">
              <label for="play-folder-input" class="field-label">Content folder</label>
              <div
                class="flex items-center gap-2 rounded-lg border border-line bg-canvas py-1 pr-1 pl-3 transition-colors focus-within:border-accent focus-within:ring-3 focus-within:ring-accent/25 hover:border-line-strong">
                <i data-lucide="folder" class="h-4 w-4 shrink-0 text-ink-faint"></i>
                <textarea
                  id="play-folder-input"
                  class="min-h-6 flex-1 resize-none overflow-hidden bg-transparent py-1 leading-6 break-all whitespace-pre-wrap placeholder:text-ink-faint focus:outline-none"
                  rows="1"
                  placeholder="Select a folder of numbered media files"
                  style="resize: none"></textarea>
                <button id="clear-play-folder-btn" class="btn btn-sm btn-ghost btn-icon" title="Clear" aria-label="Clear">
                  <i data-lucide="x"></i>
                </button>
                <button id="select-play-folder-btn" class="btn btn-sm">Browse…</button>
              </div>
            </div>

            <!-- Preset settings -->
            <div class="border-t border-line-faint px-5 pt-4 pb-5">
              <div class="grid grid-cols-[repeat(2,minmax(0,8.5rem))_minmax(14rem,1fr)] gap-3">
                <div>
                  <label for="enable-bus-input" class="field-label">
                    <span class="tip" data-tip="This bus will be enabled for all the inputs in the playlist.">Enable bus</span>
                  </label>
                  <select id="enable-bus-input" class="select">
                    <option value="">None</option>
                    <option selected>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                    <option>E</option>
                    <option>F</option>
                  </select>
                </div>

                <div>
                  <label for="collapse-inputs-input" class="field-label">
                    <span class="tip" data-tip="Inputs will appear minimized in vMix.">Collapse inputs</span>
                  </label>
                  <select id="collapse-inputs-input" class="select">
                    <option value="1">Yes</option>
                    <option selected value="0">No</option>
                  </select>
                </div>

                <div>
                  <label for="custom-parent-folder-input" class="field-label">
                    <span
                      class="tip"
                      data-tip="Replaces the folder path before the playlist source folder in generated input paths. Leave empty to keep the original paths."
                      >Custom parent folder</span
                    >
                  </label>
                  <input type="text" class="input" id="custom-parent-folder-input" list="custom-parent-folder-options" placeholder="D:\Livestream" />
                  <datalist id="custom-parent-folder-options">
                    <option value="D:\Livestream"></option>
                  </datalist>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-2 border-t border-line bg-surface-2/60 px-5 py-3">
              <button id="edit-config-btn" class="btn">
                <i data-lucide="sliders-horizontal"></i>
                Open Config
              </button>
              <button id="create-preset-btn" class="btn btn-primary">
                <i data-lucide="file-plus-2"></i>
                Create vMix Preset
              </button>
            </div>
          </section>

          <section class="panel overflow-hidden">
            <div class="flex items-center justify-between px-5 pt-4 pb-2">
              <h2 class="eyebrow">Recent folders</h2>
              <span id="recent-folders-count" class="text-xs text-ink-faint tabular-nums"></span>
            </div>
            <ul id="recent-folders-table" class="max-h-90 overflow-y-auto px-2 pb-2"></ul>
          </section>
        </main>
      </div>

      <!-- CONFIG PAGE -->
      <div id="config-page" class="absolute inset-0 hidden overflow-hidden">
        <div class="flex h-full flex-col">
          <header class="app-header shrink-0">
            <button id="cancel-config-btn" class="btn btn-sm btn-ghost btn-icon shrink-0" title="Back" aria-label="Back">
              <i data-lucide="arrow-left"></i>
            </button>
            <div class="min-w-0 flex-1">
              <span id="config-title" class="block min-w-0 text-[15px] font-semibold tracking-tight"></span>
              <span id="config-base" class="block truncate text-xs text-ink-subtle"></span>
            </div>

            <div class="flex shrink-0 items-center gap-2">
              <div id="config-view-toggle" class="seg seg-icon" aria-label="Config view">
                <button id="config-list-view-btn" type="button" title="List view" aria-label="List view">
                  <i data-lucide="list"></i>
                </button>
                <button id="config-preview-view-btn" type="button" title="Preview view" aria-label="Preview view">
                  <i data-lucide="layout-grid"></i>
                </button>
              </div>
              <button id="refresh-config-btn" class="btn btn-sm btn-icon" title="Refresh" aria-label="Refresh">
                <i data-lucide="refresh-cw"></i>
              </button>
              <button id="save-config-btn" class="btn btn-sm btn-primary" title="Save">
                <i data-lucide="save"></i>
                Save
              </button>
            </div>
          </header>

          <div class="flex min-h-0 w-full flex-1 flex-col gap-4 overflow-y-auto px-6 py-5">
            <div id="config-alerts" class="panel shrink-0 p-4">
              <div class="mb-3 flex items-center justify-between">
                <h2 class="eyebrow">Report</h2>
                <div id="config-report-summary"></div>
              </div>
              <ul id="config-alerts-list" class="max-h-50 space-y-2.5 overflow-y-auto pr-1"></ul>
            </div>

            <div id="config-subfolders" class="panel mx-auto hidden w-full max-w-300 shrink-0 overflow-hidden">
              <div class="px-5 pt-4 pb-2">
                <div class="flex items-center justify-between">
                  <h2 class="eyebrow">Playlists in subfolders</h2>
                  <span id="config-subfolders-count" class="text-xs text-ink-faint tabular-nums"></span>
                </div>
                <p id="config-subfolders-note" class="mt-1 text-[13px] text-ink-subtle"></p>
              </div>
              <ul id="config-subfolders-list" class="max-h-90 overflow-y-auto px-2 pb-2"></ul>
            </div>

            <div id="config-list-view" class="panel mx-auto w-full max-w-300 shrink-0 overflow-hidden">
              <table class="data-table">
                <thead>
                  <tr>
                    <th class="w-16">#</th>
                    <th>File</th>
                    <th class="w-32">Type</th>
                    <th class="w-104">Options</th>
                  </tr>
                </thead>
                <tbody id="config-table"></tbody>
              </table>
            </div>

            <div id="config-preview-scroll" class="hidden w-full shrink-0">
              <div id="config-preview-view" class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./lucide.min.js"></script>
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
